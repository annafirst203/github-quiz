name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Test
      run: dotnet test tests/GitHubQuiz.Tests
    - name: Publish GitHubQuiz.exe
      run: dotnet publish GitHubQuiz.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{ github.ref_name }} publish/GitHubQuiz.exe --generate-notes
